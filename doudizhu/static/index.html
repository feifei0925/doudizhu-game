<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典斗地主 - 完整音效版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "微软雅黑", sans-serif; }
        body { background: #2c3e50; color: white; padding: 20px; overflow-x: hidden; }
        .container { max-width: 1200px; margin: 0 auto; text-align: center; }
        
        /* 房间配置区 */
        .room-config {
            background: #34495e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .room-config input, .room-config select, .room-config button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            margin: 5px 0;
        }
        .room-config button {
            background: #2ecc71;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        .room-config button:hover { background: #27ae60; }
        
        /* 玩家区域 */
        .players-area {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin: 30px 0;
        }
        .player {
            background: #34495e;
            padding: 20px;
            border-radius: 10px;
            position: relative;
        }
        .player-top { height: 180px; }
        .player-self { min-height: 220px; }
        .player-bottom { height: 180px; }
        .player-title {
            font-size: 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .landlord-tag { background: #e74c3c; padding: 2px 8px; border-radius: 5px; font-size: 14px; }
        .current-turn-tag { background: #f39c12; padding: 2px 8px; border-radius: 5px; font-size: 14px; }
        .double-tag { background: #9b59b6; padding: 2px 8px; border-radius: 5px; font-size: 14px; }
        
        /* 卡牌样式 */
        .cards-container {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .card {
            width: 60px;
            height: 80px;
            background: white;
            color: black;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
        }
        .card.red { color: #e74c3c; }
        .card.black { color: #000; }
        .self-card:hover { transform: translateY(-10px); }
        .self-card.selected { background: #f1c40f; transform: translateY(-10px); }
        .hidden-card {
            width: 60px;
            height: 80px;
            background: #95a5a6;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        /* 功能按钮区 */
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .call-score-btn { background: #2ecc71; color: white; }
        .skip-score-btn { background: #e74c3c; color: white; }
        .rob-btn { background: #f39c12; color: white; }
        .double-btn { background: #9b59b6; color: white; }
        .play-btn { background: #3498db; color: white; }
        .pass-btn { background: #95a5a6; color: white; }
        .hurry-btn { background: #e67e22; color: white; }
        .action-btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .action-btn:hover:not(:disabled) {
            opacity: 0.9;
            transform: scale(1.05);
        }
        
        /* 信息区 */
        .info-area {
            background: #34495e;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
            font-size: 16px;
            min-height: 40px;
        }
        .play-history {
            background: #34495e;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
        }
        .play-history h3 {
            margin-bottom: 10px;
            text-align: center;
        }
        
        /* 弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: #34495e;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            font-size: 24px;
            min-width: 300px;
        }
        .modal-btn {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 20px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .modal-btn:hover {
            background: #27ae60;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .card {
                width: 50px;
                height: 70px;
                font-size: 16px;
            }
            .hidden-card {
                width: 50px;
                height: 70px;
                font-size: 16px;
            }
            .action-btn {
                padding: 8px 15px;
                font-size: 14px;
            }
            .modal-content {
                padding: 20px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>经典斗地主 🃏</h1>
        
        <!-- 房间配置 -->
        <div class="room-config">
            <div>
                房间ID：<input type="text" id="roomId" value="1001" placeholder="输入房间ID">
            </div>
            <div>
                玩家ID：<select id="playerId">
                    <option value="player1">玩家1</option>
                    <option value="player2">玩家2</option>
                    <option value="player3">玩家3</option>
                </select>
            </div>
            <button onclick="connect()">连接房间</button>
            <button onclick="toggleMusic()">背景音乐</button>
        </div>

        <!-- 玩家区域 -->
        <div class="players-area">
            <!-- 上家 -->
            <div class="player player-top" id="playerTop">
                <div class="player-title" id="playerTopTitle">上家 <span id="playerTopTag"></span></div>
                <div class="cards-container" id="playerTopCards">
                    <div class="hidden-card">?</div>
                </div>
            </div>

            <!-- 自己 -->
            <div class="player player-self" id="playerSelf">
                <div class="player-title" id="playerSelfTitle">自己 <span id="playerSelfTag"></span></div>
                <div class="cards-container" id="playerSelfCards"></div>
            </div>

            <!-- 下家 -->
            <div class="player player-bottom" id="playerBottom">
                <div class="player-title" id="playerBottomTitle">下家 <span id="playerBottomTag"></span></div>
                <div class="cards-container" id="playerBottomCards">
                    <div class="hidden-card">?</div>
                </div>
            </div>
        </div>

        <!-- 叫分/抢地主/加倍按钮 -->
        <div class="action-buttons" id="scoreButtons">
            <button class="action-btn call-score-btn" id="call1Btn" onclick="callScore(1)" disabled>叫1分</button>
            <button class="action-btn call-score-btn" id="call2Btn" onclick="callScore(2)" disabled>叫2分</button>
            <button class="action-btn call-score-btn" id="call3Btn" onclick="callScore(3)" disabled>叫3分</button>
            <button class="action-btn skip-score-btn" id="skipScoreBtn" onclick="callScore(0)" disabled>不叫</button>
        </div>

        <div class="action-buttons" id="robButtons" style="display: none;">
            <button class="action-btn rob-btn" id="robBtn" onclick="robLandlord('rob')" disabled>抢地主</button>
            <button class="action-btn skip-score-btn" id="skipRobBtn" onclick="robLandlord('skip')" disabled>不抢</button>
        </div>

        <div class="action-buttons" id="doubleButtons" style="display: none;">
            <button class="action-btn double-btn" id="doubleBtn" onclick="double('double')" disabled>加倍</button>
            <button class="action-btn skip-score-btn" id="skipDoubleBtn" onclick="double('skip')" disabled>不加倍</button>
        </div>

        <!-- 出牌按钮（含催促按钮） -->
        <div class="action-buttons" id="playButtons">
            <button class="action-btn play-btn" id="playCardsBtn" onclick="playSelectedCards()" disabled>出牌</button>
            <button class="action-btn pass-btn" id="passCardsBtn" onclick="passCards()" disabled>过</button>
            <button class="action-btn hurry-btn" id="hurryBtn" onclick="hurryUp()" disabled>催他出牌 🚀</button>
        </div>

        <!-- 出牌记录 -->
        <div class="play-history">
            <h3>出牌记录</h3>
            <div id="playHistoryContent">暂无出牌</div>
        </div>

        <!-- 信息提示 -->
        <div class="info-area" id="infoArea">等待连接房间...</div>

        <!-- 结算弹窗 -->
        <div class="modal" id="resultModal">
            <div class="modal-content">
                <div id="resultMsg">恭喜获胜！</div>
                <div id="scoreMsg" style="margin-top: 20px; font-size: 18px;"></div>
                <button class="modal-btn" onclick="closeModal()">重新开始</button>
            </div>
        </div>
    </div>

    <!-- 全套音效资源 -->
    <audio id="bgMusic" loop>
        <source src="sounds/bg_music.mp3" type="audio/mpeg">
    </audio>
    <audio id="callScoreSound">
        <source src="sounds/call_score.mp3" type="audio/mpeg">
    </audio>
    <audio id="robLandlordSound">
        <source src="sounds/rob_landlord.mp3" type="audio/mpeg">
    </audio>
    <audio id="doubleSound">
        <source src="sounds/double.mp3" type="audio/mpeg">
    </audio>
    <audio id="playCardSound">
        <source src="sounds/play_card.mp3" type="audio/mpeg">
    </audio>
    <audio id="bombSound">
        <source src="sounds/bomb.mp3" type="audio/mpeg">
    </audio>
    <audio id="kingBombSound">
        <source src="sounds/king_bomb.mp3" type="audio/mpeg">
    </audio>
    <audio id="winSound">
        <source src="sounds/win.mp3" type="audio/mpeg">
    </audio>
    <audio id="loseSound">
        <source src="sounds/lose.mp3" type="audio/mpeg">
    </audio>
    <audio id="errorSound">
        <source src="sounds/error.mp3" type="audio/mpeg">
    </audio>
    <audio id="countdownSound">
        <source src="sounds/countdown.mp3" type="audio/mpeg">
    </audio>
    <audio id="hurryUpSound">
        <source src="sounds/hurry_up.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 全局变量
        let ws = null;
        let roomId = "";
        let playerId = "";
        let selfCards = [];
        let selectedCards = [];
        let landlord = "";
        let currentTurn = "";
        let gameStatus = "waiting";

        // 播放音效
        function playSound(id) {
            const sound = document.getElementById(id);
            if (!sound) return;
            sound.currentTime = 0;
            sound.play().catch(err => console.log("音效播放失败：", err));
        }

        // 背景音乐控制
        function toggleMusic() {
            const bgMusic = document.getElementById("bgMusic");
            if (bgMusic.paused) {
                bgMusic.play().catch(err => console.log("背景音乐播放失败：", err));
                showInfo("背景音乐已开启");
            } else {
                bgMusic.pause();
                showInfo("背景音乐已关闭");
            }
        }

        // 连接WebSocket
        function connect() {
            roomId = document.getElementById("roomId").value.trim();
            playerId = document.getElementById("playerId").value;
            
            if (!roomId) {
                showInfo("请输入有效的房间ID！");
                playSound("errorSound");
                return;
            }

            // 关闭现有连接
            if (ws) {
                ws.close();
            }

            // 创建新连接
            const wsUrl = `ws://${window.location.hostname}:8000/ws/${roomId}/${playerId}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                showInfo(`成功连接房间【${roomId}】，玩家ID：${playerId}`);
                initPlayerTitles();
                // 重置游戏状态
                resetGame();
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleServerMsg(data);
                } catch (e) {
                    showInfo("解析服务器消息失败：" + e.message);
                    playSound("errorSound");
                }
            };

            ws.onclose = (event) => {
                showInfo(`与服务器断开连接（代码：${event.code}）：${event.reason || "未知原因"}`);
                resetGame();
                disableAllButtons();
            };

            ws.onerror = (error) => {
                showInfo("连接服务器出错：" + error.message);
                playSound("errorSound");
            };
        }

        // 初始化玩家标题
        function initPlayerTitles() {
            const topTitle = document.getElementById("playerTopTitle");
            const bottomTitle = document.getElementById("playerBottomTitle");
            
            if (playerId === "player1") {
                topTitle.innerText = "玩家2（上家）";
                bottomTitle.innerText = "玩家3（下家）";
            } else if (playerId === "player2") {
                topTitle.innerText = "玩家3（上家）";
                bottomTitle.innerText = "玩家1（下家）";
            } else if (playerId === "player3") {
                topTitle.innerText = "玩家1（上家）";
                bottomTitle.innerText = "玩家2（下家）";
            }
            
            // 重置标签
            document.getElementById("playerTopTag").innerHTML = "";
            document.getElementById("playerSelfTag").innerHTML = "";
            document.getElementById("playerBottomTag").innerHTML = "";
        }

        // 处理服务器消息
        function handleServerMsg(data) {
            switch (data.type) {
                case "room_status":
                    showInfo(`房间状态：${data.status}，当前人数：${data.player_count}/3`);
                    updateOtherPlayersCards(data.players);
                    break;
                
                case "call_score_start":
                    gameStatus = "call_score";
                    showInfo(data.msg);
                    // 显示叫分按钮
                    document.getElementById("scoreButtons").style.display = "flex";
                    document.getElementById("robButtons").style.display = "none";
                    document.getElementById("doubleButtons").style.display = "none";
                    // 激活当前玩家按钮
                    if (data.current_player === playerId) {
                        enableScoreButtons();
                        playSound("callScoreSound");
                    } else {
                        disableScoreButtons();
                    }
                    break;
                
                case "call_score_ok":
                case "call_score_skip":
                    showInfo(data.msg);
                    disableScoreButtons();
                    break;
                
                case "call_score_next":
                    showInfo(data.msg);
                    if (data.next_player === playerId) {
                        enableScoreButtons();
                        playSound("callScoreSound");
                    }
                    break;
                
                case "rob_landlord_start":
                    gameStatus = "rob_landlord";
                    showInfo(data.msg);
                    document.getElementById("scoreButtons").style.display = "none";
                    document.getElementById("robButtons").style.display = "flex";
                    if (data.current_player === playerId) {
                        enableRobButtons();
                        playSound("robLandlordSound");
                    } else {
                        disableRobButtons();
                    }
                    break;
                
                case "rob_landlord_ok":
                case "rob_landlord_skip":
                    showInfo(data.msg);
                    disableRobButtons();
                    break;
                
                case "double_start":
                    gameStatus = "double";
                    showInfo(data.msg);
                    document.getElementById("robButtons").style.display = "none";
                    document.getElementById("doubleButtons").style.display = "flex";
                    enableDoubleButtons();
                    playSound("doubleSound");
                    break;
                
                case "double_ok":
                    showInfo(data.msg);
                    disableDoubleButtons();
                    break;
                
                case "game_start":
                    gameStatus = "playing";
                    landlord = data.landlord;
                    currentTurn = data.current_turn;
                    selfCards = data.player_cards[playerId] || [];
                    // 更新标识
                    updateLandlordTag(landlord);
                    updateCurrentTurnTag(currentTurn);
                    // 渲染手牌
                    renderSelfCards(selfCards);
                    // 更新按钮状态
                    updatePlayButtons();
                    updateHurryButton();
                    showInfo(data.msg);
                    break;
                
                case "play_card_ok":
                    showInfo(data.msg);
                    // 播放对应音效
                    if (data.sound_type === "bomb") playSound("bombSound");
                    else if (data.sound_type === "king_bomb") playSound("kingBombSound");
                    else playSound("playCardSound");
                    // 更新出牌记录
                    addPlayHistory(data.player, data.cards, data.card_type);
                    // 更新手牌
                    if (data.player === playerId) {
                        selfCards = selfCards.filter(card => !data.cards.includes(card));
                        renderSelfCards(selfCards);
                        selectedCards = [];
                    }
                    // 更新剩余牌数
                    if (data.remaining_cards) {
                        updateOtherPlayersRemainingCards(data.remaining_cards);
                    }
                    break;
                
                case "play_card_pass":
                    showInfo(data.msg);
                    addPlayHistory(data.player, [], "过牌");
                    break;
                
                case "play_card_next":
                    currentTurn = data.current_turn;
                    updateCurrentTurnTag(currentTurn);
                    updatePlayButtons();
                    updateHurryButton();
                    showInfo(data.msg);
                    break;
                
                case "game_over":
                    gameStatus = "finished";
                    showInfo(data.msg);
                    // 显示结算弹窗
                    const resultMsg = document.getElementById("resultMsg");
                    const scoreMsg = document.getElementById("scoreMsg");
                    
                    if (data.winner === playerId) {
                        resultMsg.innerText = `恭喜！你${data.is_landlord ? "（地主）" : "（农民）"}获胜！`;
                        playSound("winSound");
                    } else {
                        resultMsg.innerText = `很遗憾！玩家${data.winner}获胜，你失败了！`;
                        playSound("loseSound");
                    }
                    
                    scoreMsg.innerText = `本局分数：${JSON.stringify(data.score)}`;
                    document.getElementById("resultModal").style.display = "flex";
                    // 禁用所有按钮
                    disableAllButtons();
                    break;
                
                case "error":
                    showInfo(`错误：${data.msg}`);
                    playSound("errorSound");
                    break;
                
                case "player_disconnect":
                    showInfo(data.msg);
                    playSound("errorSound");
                    break;
                
                case "chat":
                    showInfo(`[玩家${data.player}]：${data.msg}`);
                    // 追加到聊天记录
                    const history = document.getElementById("playHistoryContent");
                    history.innerHTML += `<br>[系统] 玩家${data.player}：${data.msg}`;
                    history.scrollTop = history.scrollHeight;
                    break;
                
                default:
                    showInfo(`收到未知消息：${JSON.stringify(data)}`);
                    break;
            }
        }

        // 渲染自己的牌
        function renderSelfCards(cards) {
            const container = document.getElementById("playerSelfCards");
            container.innerHTML = "";
            
            if (!cards || cards.length === 0) {
                container.innerHTML = "<div style='color: #95a5a6;'>暂无手牌</div>";
                return;
            }

            cards.forEach(card => {
                const cardEl = document.createElement("div");
                cardEl.className = "card self-card";
                // 区分红黑花色
                if (card.includes("♥") || card.includes("♦")) {
                    cardEl.classList.add("red");
                } else {
                    cardEl.classList.add("black");
                }
                cardEl.innerText = card;
                cardEl.dataset.card = card;
                cardEl.onclick = () => toggleCardSelection(card);
                container.appendChild(cardEl);
            });
        }

        // 切换卡牌选中
        function toggleCardSelection(card) {
            if (gameStatus !== "playing" || currentTurn !== playerId) {
                showInfo("现在不能选牌！");
                playSound("errorSound");
                return;
            }

            const idx = selectedCards.indexOf(card);
            const cardEl = document.querySelector(`.self-card[data-card="${card}"]`);
            
            if (idx > -1) {
                // 取消选中
                selectedCards.splice(idx, 1);
                if (cardEl) cardEl.classList.remove("selected");
            } else {
                // 选中
                selectedCards.push(card);
                if (cardEl) cardEl.classList.add("selected");
            }
        }

        // 叫分
        function callScore(score) {
            if (gameStatus !== "call_score") {
                showInfo("当前不是叫分阶段！");
                playSound("errorSound");
                return;
            }

            sendMsg({ type: "call_score", score: score });
            disableScoreButtons();
        }

        // 抢地主
        function robLandlord(action) {
            if (gameStatus !== "rob_landlord") {
                showInfo("当前不是抢地主阶段！");
                playSound("errorSound");
                return;
            }

            sendMsg({ type: "rob_landlord", action: action });
            disableRobButtons();
        }

        // 加倍
        function double(action) {
            if (gameStatus !== "double") {
                showInfo("当前不是加倍阶段！");
                playSound("errorSound");
                return;
            }

            sendMsg({ type: "double", action: action });
            disableDoubleButtons();
        }

        // 出牌
        function playSelectedCards() {
            if (selectedCards.length === 0) {
                showInfo("请选择要出的牌！");
                playSound("errorSound");
                return;
            }

            sendMsg({ type: "play_cards", cards: selectedCards });
        }

        // 过牌
        function passCards() {
            sendMsg({ type: "play_cards", cards: [] });
            disablePlayButtons();
        }

        // 催促出牌
        function hurryUp() {
            // 播放催促语音
            playSound("hurryUpSound");
            // 发送催促聊天消息
            sendMsg({
                type: "chat",
                msg: "快点吧我等的花都谢了！😜"
            });
            // 本地提示
            showInfo("你发送了催促语音：快点吧我等的花都谢了！");
        }

        // 发送消息到服务器
        function sendMsg(msg) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showInfo("未连接到服务器，无法发送消息！");
                playSound("errorSound");
                return;
            }

            try {
                ws.send(JSON.stringify(msg));
            } catch (e) {
                showInfo("发送消息失败：" + e.message);
                playSound("errorSound");
            }
        }

        // 更新地主标识
        function updateLandlordTag(landlordId) {
            // 清空所有地主标签
            document.getElementById("playerTopTag").innerHTML = "";
            document.getElementById("playerSelfTag").innerHTML = "";
            document.getElementById("playerBottomTag").innerHTML = "";

            const addTag = (pid, tid) => {
                if (pid === landlordId) {
                    const tag = document.createElement("span");
                    tag.className = "landlord-tag";
                    tag.innerText = "地主";
                    document.getElementById(tid).appendChild(tag);
                }
            };

            if (playerId === "player1") {
                addTag("player1", "playerSelfTag");
                addTag("player2", "playerTopTag");
                addTag("player3", "playerBottomTag");
            } else if (playerId === "player2") {
                addTag("player2", "playerSelfTag");
                addTag("player3", "playerTopTag");
                addTag("player1", "playerBottomTag");
            } else if (playerId === "player3") {
                addTag("player3", "playerSelfTag");
                addTag("player1", "playerTopTag");
                addTag("player2", "playerBottomTag");
            }
        }

        // 更新当前回合标识
        function updateCurrentTurnTag(turnId) {
            // 清空所有回合标签
            document.getElementById("playerTopTag").innerHTML = document.getElementById("playerTopTag").innerHTML.replace(/<span class="current-turn-tag">.*?<\/span>/g, "");
            document.getElementById("playerSelfTag").innerHTML = document.getElementById("playerSelfTag").innerHTML.replace(/<span class="current-turn-tag">.*?<\/span>/g, "");
            document.getElementById("playerBottomTag").innerHTML = document.getElementById("playerBottomTag").innerHTML.replace(/<span class="current-turn-tag">.*?<\/span>/g, "");

            const addTag = (pid, tid) => {
                if (pid === turnId) {
                    const tag = document.createElement("span");
                    tag.className = "current-turn-tag";
                    tag.innerText = "当前回合";
                    document.getElementById(tid).appendChild(tag);
                }
            };

            if (playerId === "player1") {
                addTag("player1", "playerSelfTag");
                addTag("player2", "playerTopTag");
                addTag("player3", "playerBottomTag");
            } else if (playerId === "player2") {
                addTag("player2", "playerSelfTag");
                addTag("player3", "playerTopTag");
                addTag("player1", "playerBottomTag");
            } else if (playerId === "player3") {
                addTag("player3", "playerSelfTag");
                addTag("player1", "playerTopTag");
                addTag("player2", "playerBottomTag");
            }
        }

        // 更新其他玩家牌数
        function updateOtherPlayersCards(players) {
            if (playerId === "player1") {
                updatePlayerCardCount("playerTopCards", players.includes("player2") ? "?" : "离线");
                updatePlayerCardCount("playerBottomCards", players.includes("player3") ? "?" : "离线");
            } else if (playerId === "player2") {
                updatePlayerCardCount("playerTopCards", players.includes("player3") ? "?" : "离线");
                updatePlayerCardCount("playerBottomCards", players.includes("player1") ? "?" : "离线");
            } else if (playerId === "player3") {
                updatePlayerCardCount("playerTopCards", players.includes("player1") ? "?" : "离线");
                updatePlayerCardCount("playerBottomCards", players.includes("player2") ? "?" : "离线");
            }
        }

        // 更新剩余牌数
        function updateOtherPlayersRemainingCards(remaining) {
            if (playerId === "player1") {
                updatePlayerCardCount("playerTopCards", remaining.player2 || 0);
                updatePlayerCardCount("playerBottomCards", remaining.player3 || 0);
            } else if (playerId === "player2") {
                updatePlayerCardCount("playerTopCards", remaining.player3 || 0);
                updatePlayerCardCount("playerBottomCards", remaining.player1 || 0);
            } else if (playerId === "player3") {
                updatePlayerCardCount("playerTopCards", remaining.player1 || 0);
                updatePlayerCardCount("playerBottomCards", remaining.player2 || 0);
            }
        }

        // 更新牌数显示
        function updatePlayerCardCount(containerId, count) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
            
            const card = document.createElement("div");
            card.className = "hidden-card";
            card.innerText = count;
            container.appendChild(card);
        }

        // 添加出牌记录
        function addPlayHistory(player, cards, cardType) {
            const content = document.getElementById("playHistoryContent");
            const playerName = getPlayerShowName(player);
            
            let historyText = "";
            if (cards.length === 0) {
                historyText = `<br>[${playerName}]：${cardType}`;
            } else {
                historyText = `<br>[${playerName}]：${cards.join(", ")}（${cardType}）`;
            }
            
            content.innerHTML += historyText;
            content.scrollTop = content.scrollHeight;
        }

        // 获取玩家显示名
        function getPlayerShowName(player) {
            if (player === playerId) return "自己";
            if (playerId === "player1") return player === "player2" ? "上家（玩家2）" : "下家（玩家3）";
            if (playerId === "player2") return player === "player3" ? "上家（玩家3）" : "下家（玩家1）";
            if (playerId === "player3") return player === "player1" ? "上家（玩家1）" : "下家（玩家2）";
        }

        // 显示信息提示
        function showInfo(msg) {
            const infoArea = document.getElementById("infoArea");
            infoArea.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            // 滚动到最新
            infoArea.scrollTop = 0;
        }

        // 更新催促按钮状态
        function updateHurryButton() {
            // 非自己回合、游戏中状态时可催促
            const canHurry = (currentTurn !== playerId) && (gameStatus === "playing");
            document.getElementById("hurryBtn").disabled = !canHurry;
        }

        // 按钮控制函数
        function enableScoreButtons() {
            document.getElementById("call1Btn").disabled = false;
            document.getElementById("call2Btn").disabled = false;
            document.getElementById("call3Btn").disabled = false;
            document.getElementById("skipScoreBtn").disabled = false;
        }

        function disableScoreButtons() {
            document.getElementById("call1Btn").disabled = true;
            document.getElementById("call2Btn").disabled = true;
            document.getElementById("call3Btn").disabled = true;
            document.getElementById("skipScoreBtn").disabled = true;
        }

        function enableRobButtons() {
            document.getElementById("robBtn").disabled = false;
            document.getElementById("skipRobBtn").disabled = false;
        }

        function disableRobButtons() {
            document.getElementById("robBtn").disabled = true;
            document.getElementById("skipRobBtn").disabled = true;
        }

        function enableDoubleButtons() {
            document.getElementById("doubleBtn").disabled = false;
            document.getElementById("skipDoubleBtn").disabled = false;
        }

        function disableDoubleButtons() {
            document.getElementById("doubleBtn").disabled = true;
            document.getElementById("skipDoubleBtn").disabled = true;
        }

        function updatePlayButtons() {
            const isMyTurn = (currentTurn === playerId) && (gameStatus === "playing");
            document.getElementById("playCardsBtn").disabled = !isMyTurn;
            document.getElementById("passCardsBtn").disabled = !isMyTurn;
        }

        function disablePlayButtons() {
            document.getElementById("playCardsBtn").disabled = true;
            document.getElementById("passCardsBtn").disabled = true;
        }

        function disableAllButtons() {
            disableScoreButtons();
            disableRobButtons();
            disableDoubleButtons();
            disablePlayButtons();
            document.getElementById("hurryBtn").disabled = true;
        }

        // 重置游戏状态
        function resetGame() {
            selfCards = [];
            selectedCards = [];
            landlord = "";
            currentTurn = "";
            gameStatus = "waiting";
            
            // 清空界面
            renderSelfCards([]);
            updateOtherPlayersCards([]);
            document.getElementById("playHistoryContent").innerText = "暂无出牌";
            
            // 隐藏所有按钮组
            document.getElementById("scoreButtons").style.display = "none";
            document.getElementById("robButtons").style.display = "none";
            document.getElementById("doubleButtons").style.display = "none";
            
            // 禁用所有按钮
            disableAllButtons();
            
            // 清空标签
            document.getElementById("playerTopTag").innerHTML = "";
            document.getElementById("playerSelfTag").innerHTML = "";
            document.getElementById("playerBottomTag").innerHTML = "";
            
            showInfo("游戏已重置，等待连接房间...");
        }

        // 关闭结算弹窗
        function closeModal() {
            document.getElementById("resultModal").style.display = "none";
            resetGame();
            // 重新连接
            connect();
        }

        // 页面加载完成初始化
        window.onload = function() {
            showInfo("页面加载完成，请连接房间开始游戏！");
            // 隐藏所有按钮组
            document.getElementById("scoreButtons").style.display = "none";
            document.getElementById("robButtons").style.display = "none";
            document.getElementById("doubleButtons").style.display = "none";
        };

        // 监听页面关闭，断开连接
        window.onbeforeunload = function() {
            if (ws) {
                ws.close();
            }
        };
    </script>
</body>
</html>
